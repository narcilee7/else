[package]
name = "else-api"
version = "0.1.1"
edition.workspace = true
description = "else runtime API: one API for all surfaces (CLI/Web/desktop/App/IM)"
license = "MIT"
repository = "https://github.com/narcilee7/else"
homepage = "https://github.com/narcilee7/else"
readme = "../README.md"
keywords = ["agent", "api", "runtime"]
categories = ["api-bindings"]
exclude = ["tests/", ".github/", "surfaces/apple/", "**/*.rs.bk"]

[dependencies]
else-protocol = { path = "../core/else-protocol", version = "0.1.1" }
else-ledger = { path = "../core/else-ledger", version = "0.1.1" }
else-context = { path = "../core/else-context", version = "0.1.1" }
else-connector = { path = "../core/else-connector", version = "0.1.1" }
else-secrets = { path = "../core/else-secrets", version = "0.1.1" }
else-attention = { path = "../core/else-attention", version = "0.1.1" }
else-gateway = { path = "../core/else-gateway", version = "0.1.1" }
else-harness = { path = "../core/else-harness", version = "0.1.1" }
else-environment = { path = "../core/else-environment", version = "0.1.1" }
else-workspace = { path = "../core/else-workspace", version = "0.1.1" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
base64.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
