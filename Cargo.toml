[workspace]
resolver = "2"
members = [
    "core/else-protocol",
    "core/else-ledger",
    "core/else-context",
    "core/else-connector",
    "core/else-secrets",
    "core/else-attention",
    "core/else-gateway",
    "core/else-harness",
    "core/else-client",
    "core/else-workspace",
    "core/else-environment",
    "api",
    "surfaces/daemon",
    "surfaces/cli",
]

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
ical = "0.11"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"
crossterm = "0.29"

[profile.release]
lto = "thin"
