[package]
name = "else-daemon"
version = "0.1.3"
edition.workspace = true
description = "Loopback HTTP daemon for the else Intent Runtime"
license = "MIT"
repository = "https://github.com/narcilee7/else"
homepage = "https://github.com/narcilee7/else"
readme = "../../README.md"
keywords = ["daemon", "http", "agent"]
categories = ["api-bindings"]
exclude = ["tests/", ".github/", "surfaces/apple/", "**/*.rs.bk"]

[dependencies]
else-api = { path = "../../api", version = "0.1.3" }
else-harness = { path = "../../core/else-harness", version = "0.1.3" }
else-ledger = { path = "../../core/else-ledger", version = "0.1.3" }
else-protocol = { path = "../../core/else-protocol", version = "0.1.3" }
chrono.workspace = true
fs2 = "0.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tiny_http = "0.12"
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
