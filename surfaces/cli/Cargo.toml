[package]
name = "else-bot"
version = "0.1.2"
edition.workspace = true
description = "else-bot: terminal client for the else Intent Runtime"
license = "MIT"
repository = "https://github.com/narcilee7/else"
homepage = "https://github.com/narcilee7/else"
readme = "../../README.md"
keywords = ["cli", "tui", "agent"]
categories = ["command-line-utilities"]
exclude = ["tests/", ".github/", "surfaces/apple/", "**/*.rs.bk"]

[[bin]]
name = "else-bot"
path = "src/main.rs"

[dependencies]
else-api = { path = "../../api", version = "0.1.2" }
else-client = { path = "../../core/else-client", version = "0.1.2" }
else-harness = { path = "../../core/else-harness", version = "0.1.2" }
else-protocol = { path = "../../core/else-protocol", version = "0.1.2" }
else-ledger = { path = "../../core/else-ledger", version = "0.1.2" }
else-context = { path = "../../core/else-context", version = "0.1.2" }
else-daemon = { path = "../daemon", version = "0.1.2" }
clap = { version = "4", features = ["derive"] }
ratatui.workspace = true
unicode-width.workspace = true
crossterm.workspace = true
chrono.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
expectrl = "0.8"
tempfile.workspace = true
