[package]
name = "else-cli"
version = "0.1.0"
edition.workspace = true
description = "else CLI: the first thin client of the runtime API"

[[bin]]
name = "else"
path = "src/main.rs"

[dependencies]
else-api = { path = "../../api" }
else-protocol = { path = "../../core/else-protocol" }
else-ledger = { path = "../../core/else-ledger" }
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
