[package]
name = "else-gateway"
version = "0.1.3"
edition.workspace = true
description = "else gateways: Tool Gateway (side effects, authority) + Model Gateway (accounting)"
license = "MIT"
repository = "https://github.com/narcilee7/else"
homepage = "https://github.com/narcilee7/else"
readme = "../../README.md"
keywords = ["gateway", "authorization", "agent"]
categories = ["api-bindings"]
exclude = ["tests/", ".github/", "surfaces/apple/", "**/*.rs.bk"]

[dependencies]
else-protocol = { path = "../else-protocol", version = "0.1.3" }
else-ledger = { path = "../else-ledger", version = "0.1.3" }
else-attention = { path = "../else-attention", version = "0.1.3" }
else-environment = { path = "../else-environment", version = "0.1.3" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
genai = "0.7"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile.workspace = true
