[package]
name = "else-context"
version = "0.1.1"
edition.workspace = true
description = "else context plane: intent resolution, tiered memory, context compiler"
license = "MIT"
repository = "https://github.com/narcilee7/else"
homepage = "https://github.com/narcilee7/else"
readme = "../../README.md"
keywords = ["memory", "context", "agent"]
categories = ["development-tools::cargo-plugins"]
exclude = ["tests/", ".github/", "surfaces/apple/", "**/*.rs.bk"]

[dependencies]
else-protocol = { path = "../else-protocol", version = "0.1.1" }
else-ledger = { path = "../else-ledger", version = "0.1.1" }
chrono.workspace = true
