name: Dispatch Probe

on:
  workflow_dispatch:
    inputs:
      bump:
        description: How far to move the version (ignored when a version is given)
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch
      version:
        description: Exact version to release, e.g. 0.2.0 or 0.2.0-beta.1. Empty = use bump
        type: string
        required: false
      dry_run:
        description: Print the plan without committing or tagging
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "bump=${{ inputs.bump }} version=${{ inputs.version }} dry=${{ inputs.dry_run }}"
