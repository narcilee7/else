name: Cut Release

# 发布只有这一个入口：改版本号、提交、打标签、推。
# 标签推上去之后由 release-cli.yml 负责构建四平台制品、发布 Release、
# 更新 Homebrew formula —— 中间不需要有人在本机做任何事。
on:
  workflow_dispatch:
    inputs:
      bump:
        description: How far to move the version (ignored when a version is given)
        type: choice
        options: [patch, minor, major, none]
        default: patch
      version:
        description: Exact version to release, e.g. 0.2.0 or 0.2.0-beta.1. Empty = use bump
        type: string
        required: false
      dry_run:
        description: Print the plan without committing or tagging
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cut-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      # 先证明这次要打标签的那棵树是好的。标签一旦推出去就会发制品，
      # 事后补救要删标签，所以宁可在这里多花两分钟。
      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --workspace

      - name: Decide the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION}" ]]; then
            python3 scripts/bump-version.py "${INPUT_VERSION}"
          elif [[ "${INPUT_BUMP}" != "none" ]]; then
            python3 scripts/bump-version.py --next "${INPUT_BUMP}"
          fi
          version="$(grep -m1 '^version = ' surfaces/cli/Cargo.toml | cut -d'"' -f2)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "releasing ${version}"

      - name: Refuse a version that is already tagged
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/v${VERSION}" >/dev/null; then
            echo "tag v${VERSION} already exists — bump or pass a different version" >&2
            exit 1
          fi

      - name: Show what will be committed
        run: |
          git status --short
          git --no-pager diff --stat

      - name: Stop here on a dry run
        if: inputs.dry_run
        run: echo "dry run: nothing committed, nothing tagged"

      - name: Commit the version and tag it
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "version already at ${VERSION}; tagging the current commit"
          else
            git commit -m "chore: ${VERSION}"
            git push origin HEAD:master
          fi
          git tag -a "v${VERSION}" -m "else-bot ${VERSION}"
          git push origin "v${VERSION}"

      - name: Where to watch the rest
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          echo "Tagged v${VERSION}. The release build continues in the Release CLI workflow:"
          echo "  https://github.com/${REPO}/actions/workflows/release-cli.yml"
