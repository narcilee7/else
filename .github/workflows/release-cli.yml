name: Release CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching else-bot in Cargo.toml
        required: true
        default: 0.1.0
      publish:
        description: Create a GitHub Release after building
        required: true
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --workspace

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            builder: cargo
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            builder: cross
          - runner: macos-15
            target: aarch64-apple-darwin
            builder: cargo
          - runner: macos-15
            target: x86_64-apple-darwin
            builder: cargo
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Add Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Install cross
        if: matrix.builder == 'cross'
        run: cargo install cross --locked
      - name: Package CLI
        env:
          BUILDER: ${{ matrix.builder }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          scripts/package-cli.sh "$version" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: else-${{ matrix.target }}
          path: |
            dist/else-${{ matrix.target }}.tar.gz
            dist/else-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: else-*
          merge-multiple: true
      - name: Generate aggregate checksums
        run: |
          rm -f dist/*.tar.gz.sha256
          cd dist
          for archive in *.tar.gz; do sha256sum "$archive"; done | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: else-bot-release
          path: dist
          if-no-files-found: error
          retention-days: 30

  release:
    needs: assemble
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: else-bot-release
          path: dist
      - name: Create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists" >&2
            exit 1
          fi

          release_args=()
          if [[ "$version" == *-* ]]; then
            notes="CLI/TUI prerelease for Linux and macOS. This build is not marked Latest and does not update the stable Homebrew formula. macOS CLI binaries are ad-hoc signed because no Apple credentials are configured. The macOS App is not included."
            release_args+=(--prerelease)
          else
            notes="CLI/TUI release for Linux and macOS. macOS CLI binaries are ad-hoc signed because no Apple credentials are configured. The macOS App is not included."
            release_args+=(--latest)
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS install.sh \
              --title "else-bot $version" \
              --notes "$notes" \
              "${release_args[@]}"
          else
            gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS install.sh \
              --target "$GITHUB_SHA" \
              --title "else-bot $version" \
              --notes "$notes" \
              "${release_args[@]}"
          fi

  homebrew:
    needs: release
    if: needs.release.outputs.version != '' && !contains(needs.release.outputs.version, '-')
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: else-bot-release
          path: dist
      - name: Sync master
        run: git pull --rebase origin master
      - name: Update Homebrew formula
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          python3 scripts/update-homebrew-formula.py "$version" dist
      - name: Upload formula release asset
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          gh release upload "v${version}" Formula/else-bot.rb --clobber
      - name: Commit formula
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/else-bot.rb
          git diff --cached --quiet && exit 0
          git commit -m "Update Homebrew formula for v${version}"
          git push origin HEAD:master
      - name: Update Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          tap_dir="$(mktemp -d)"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/narcilee7/homebrew-tap.git" "$tap_dir"
          mkdir -p "$tap_dir/Formula"
          cp Formula/else-bot.rb "$tap_dir/Formula/else-bot.rb"
          cd "$tap_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/else-bot.rb
          git diff --cached --quiet && exit 0
          git commit -m "Update else to v${version}"
          git push origin main
      - name: Report missing Homebrew tap token
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::warning::Set HOMEBREW_TAP_TOKEN to update narcilee7/homebrew-tap automatically."
